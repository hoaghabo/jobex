services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: jobex_backend
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 1
      --threads 2
      --timeout 120
      --graceful-timeout 30
      --access-logfile -
      --error-logfile -
      --log-level info
    environment:
      DEBUG: "True"
    volumes:
      - ./Backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/.env
    depends_on:
      - db

  balebot_fetch:
    build:
      context: ./Bots/Bale_Bot_Fetch_Member
      dockerfile: Dockerfile
    container_name: jobex_balebot_fetch
    command: python run_bot.py
    volumes:
      - ./Bots/Bale_Bot_Fetch_Member:/app
    env_file:
      - ./Bots/Bale_Bot_Fetch_Member/.env
    depends_on:
      - db


  balebot_pay:
    build:
      context: ./Bots/Bale_Bot_Payment
      dockerfile: Dockerfile
    container_name: jobex_balebot_pay
    command: python run_bot.py
    volumes:
      - ./Bots/Bale_Bot_Payment:/app
    env_file:
      - ./Bots/Bale_Bot_Payment/.env
    depends_on:
      - db


  db:
    image: postgres:16
    container_name: jobex_db
    restart: always
    environment:
      POSTGRES_DB: jobex
      POSTGRES_USER: jobex_user
      POSTGRES_PASSWORD: jobex_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
